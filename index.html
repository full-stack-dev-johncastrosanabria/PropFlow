<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/PropFlow/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropFlow - Property Management</title>
    <script>
      // apply the saved (or system) theme before first paint — no flash
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch {}
      })();
      // same for the language: saved preference, else the browser language
      (() => {
        try {
          const saved = localStorage.getItem('lang');
          document.documentElement.lang = saved === 'en' || saved === 'es'
            ? saved
            : (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
        } catch {}
      })();
    </script>
    <script type="module" crossorigin src="/PropFlow/assets/index-vvyRPZ4D.js"></script>
    <link rel="stylesheet" crossorigin href="/PropFlow/assets/index-CE8zZBr7.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
